[package]
name = "rustglance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["zsoXi <zxdubx@gmail.com>"]
description = "Browser tool for AI agents: Chromium over CDP, served as MCP over stdio"
repository = "https://github.com/zsoXi/rustglance"
keywords = ["browser", "cdp", "mcp", "agent", "chromium"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "process", "time", "sync", "fs"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
